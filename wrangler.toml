name = "autoprompterbot"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[observability]
enabled = true

# Hourly, so each server can pick its own posting hour in Madison local time.
# Scheduling against a time zone rather than a fixed UTC hour means DST does
# not shift the daily post twice a year.
[triggers]
crons = ["0 * * * *"]

# Repeat suppression, per-guild source config, and the last-prompt pointer
# used by /reroll. `wrangler dev` simulates this locally and never touches
# the real namespace.
[[kv_namespaces]]
binding = "PROMPT_STATE"
id = "b2e24fda30d54bcfafe0f3e437445c0e"
