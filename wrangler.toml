name = "autoprompterbot"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[observability]
enabled = true

# Phase 3 will enable the daily prompt. Uncomment, then `npm run deploy`.
# Cron is UTC: 15:00 UTC = 10am Madison in summer (CDT), 9am in winter (CST).
# [triggers]
# crons = ["0 15 * * *"]

# Repeat suppression, per-guild source config, and the last-prompt pointer
# used by /reroll. `wrangler dev` simulates this locally and never touches
# the real namespace.
[[kv_namespaces]]
binding = "PROMPT_STATE"
id = "b2e24fda30d54bcfafe0f3e437445c0e"
